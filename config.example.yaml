# CC Gateway Configuration
# Copy to config.yaml and pair it with a local .env file.
# .env should hold deployment-specific values and secrets.
# config.yaml should keep the structured gateway and fingerprint persona.

server:
  port: ${GATEWAY_SERVER_PORT:-8443}
  tls:
    cert: "${GATEWAY_TLS_CERT:-./certs/cert.pem}"
    key: "${GATEWAY_TLS_KEY:-./certs/key.pem}"

upstream:
  url: "${GATEWAY_UPSTREAM_URL:-https://api.anthropic.com}"

# Use a proxy endpoint that is reachable from the current runtime.
# For one .env shared by local npm and Docker on the same Windows host,
# prefer a host LAN IP or another shared proxy host over 127.0.0.1.
network:
  proxy_url: ${GATEWAY_PROXY_URL:-null}

oauth:
  access_token: ${GATEWAY_OAUTH_ACCESS_TOKEN:-null}
  refresh_token: "${GATEWAY_OAUTH_REFRESH_TOKEN}"
  expires_at: ${GATEWAY_OAUTH_EXPIRES_AT:-null}

# Canonical client persona.
client:
  user_agent: "claude-cli/2.1.91 (external, sdk-cli)"
  entrypoint: sdk-cli
  client_type: sdk-cli
  required_betas:
    - oauth-2025-04-20
    - advanced-tool-use-2025-11-20

auth:
  tokens:
    - name: "${GATEWAY_CLIENT_PRIMARY_NAME:-local-dev}"
      token: "${GATEWAY_CLIENT_PRIMARY_TOKEN}"

identity:
  device_id: "${GATEWAY_IDENTITY_DEVICE_ID}"
  email: "${GATEWAY_IDENTITY_EMAIL}"

# Canonical environment fingerprint.
# Keep the structured persona here instead of flattening it into .env.
env:
  platform: darwin
  platform_raw: darwin
  arch: arm64
  node_version: v24.3.0
  terminal: iTerm2.app
  package_managers: npm,pnpm
  runtimes: node
  is_running_with_bun: false
  is_ci: false
  is_claude_ai_auth: true
  version: "2.1.81"
  version_base: "2.1.81"
  build_time: "2026-03-20T21:26:18Z"
  deployment_environment: unknown-darwin
  vcs: git
  # Optional telemetry alignment fields from first-party event metadata:
  # remote_environment_type: ssh
  # coworker_type: teammate
  # claude_code_container_id: container-abc
  # claude_code_remote_session_id: remote-session-xyz
  # tags: [team-a, canary]
  # wsl_version: WSL2
  # linux_distro_id: ubuntu
  # linux_distro_version: "24.04"
  # linux_kernel: 6.8.0-57-generic

prompt_env:
  platform: darwin
  shell: zsh
  os_version: "Darwin 24.4.0"
  working_dir: /Users/jack/projects

process:
  constrained_memory: 34359738368
  rss_range: [300000000, 500000000]
  heap_total_range: [40000000, 80000000]
  heap_used_range: [100000000, 200000000]
  external_range: [3000000, 12000000]
  array_buffers_range: [200000, 2000000]
  cpu_percent_range: [0, 35]

logging:
  level: ${GATEWAY_LOG_LEVEL:-info}
  audit: ${GATEWAY_LOG_AUDIT:-true}
  file: "${GATEWAY_LOG_FILE:-./runtime/logs/gateway.log}"
  audit_file: "${GATEWAY_AUDIT_LOG_FILE:-./runtime/logs/audit.log}"
