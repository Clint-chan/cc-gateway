# CC Gateway Configuration
# Copy to config.yaml and pair it with a local .env file.
# .env should hold deployment-specific values and secrets.
# config.yaml should keep the structured gateway and fingerprint persona.

server:
  port: ${GATEWAY_SERVER_PORT:-8443}
  tls:
    cert: "${GATEWAY_TLS_CERT:-./certs/cert.pem}"
    key: "${GATEWAY_TLS_KEY:-./certs/key.pem}"

upstream:
  url: "${GATEWAY_UPSTREAM_URL:-https://api.anthropic.com}"

# Use a proxy endpoint that is reachable from the current runtime.
# For one .env shared by local npm and Docker on the same Windows host,
# prefer a host LAN IP or another shared proxy host over 127.0.0.1.
network:
  proxy_url: ${GATEWAY_PROXY_URL:-null}

oauth:
  access_token: ${GATEWAY_OAUTH_ACCESS_TOKEN:-null}
  refresh_token: "${GATEWAY_OAUTH_REFRESH_TOKEN}"
  expires_at: ${GATEWAY_OAUTH_EXPIRES_AT:-null}

# Fingerprint assets live under ./profiles/.
# Account identity stays here; reusable fingerprint behavior moves into the profile.
# You can reference either an asset ID or a relative YAML path.
fingerprint_profile: "example-darwin-arm64"

# Runtime capacity hints belong to the account-side scheduler substrate, not the fingerprint profile.
# They do not yet enforce queueing or admission, but they shape health state and future routing policy.
capacity_profile:
  id: "starter-max5x"
  admission_mode: observe-only
  max_active_sessions_hint: 1
  rolling_window_budget_hint: 0.85
  weekly_budget_hint: 0.8
  peak_hour_multiplier: 1.25
  drain_threshold: 0.9

auth:
  tokens:
    - name: "${GATEWAY_CLIENT_PRIMARY_NAME:-local-dev}"
      token: "${GATEWAY_CLIENT_PRIMARY_TOKEN}"

identity:
  device_id: "${GATEWAY_IDENTITY_DEVICE_ID}"
  email: "${GATEWAY_IDENTITY_EMAIL}"

logging:
  level: ${GATEWAY_LOG_LEVEL:-info}
  audit: ${GATEWAY_LOG_AUDIT:-true}
  file: "${GATEWAY_LOG_FILE:-./runtime/logs/gateway.log}"
  audit_file: "${GATEWAY_AUDIT_LOG_FILE:-./runtime/logs/audit.log}"
