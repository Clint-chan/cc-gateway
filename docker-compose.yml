services:
  gateway:
    build: .
    env_file:
      - .env
    ports:
      - "${GATEWAY_PUBLIC_PORT:-8443}:${GATEWAY_SERVER_PORT:-8443}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./certs:/app/certs:ro
      - ./runtime:/app/runtime
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
